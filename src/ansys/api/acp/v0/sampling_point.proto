syntax = "proto3";
package ansys.api.acp.v0.sampling_point;
option go_package = "github.com/ansys/ansys-api-acp/ansys/api/acp/v0/sampling_point";

import "ansys/api/acp/v0/base.proto";
import "ansys/api/acp/v0/enum_types.proto";
import "ansys/api/acp/v0/array_types.proto";

message Properties {
    // general properties
    enum_types.StatusType status = 1;
    bool locked = 2; // read-only
    array_types.DoubleArray point = 3;
    array_types.DoubleArray direction = 4;

    // CLT properties
    bool use_default_reference_direction = 5;
    base.ResourcePath rosette = 6;
    array_types.DoubleArray reference_direction = 7; // read-only
    bool offset_is_middle = 8;
    bool consider_coupling_effect = 9;
}

message ObjectInfo {
    base.BasicInfo info = 1;
    Properties properties = 2;
}

message ListReply { repeated ObjectInfo objects = 1; }

message BatchGetReply {
    repeated ObjectInfo successful_replies = 1;
    repeated base.BatchItemError failed_items = 2;
}

message BatchPutRequest { repeated ObjectInfo put_requests = 1; }

message BatchPutReply {
    repeated ObjectInfo successful_replies = 1;
    repeated base.BatchItemError failed_items = 2;
}

message CreateRequest {
    base.CollectionPath collection_path = 1;
    string name = 2;
    Properties properties = 3;
}

message GetLayupRequest { base.ResourcePath resource_path = 1; }

message BatchGetLayupRequest { repeated GetLayupRequest get_requests = 1; }

message PlyLayupEntry {
    // Zero-based position in the sampling direction within this ply-level list.
    int64 order = 1;

    base.ResourcePath ply = 2;
    base.ResourcePath material = 3;

    // Angle is in degrees. Thicknesses use the model's length units.
    double angle_degrees = 5;
    // Effective thickness after draping or geometry-based adjustments.
    double thickness = 6;
    // Nominal thickness before draping or geometry-based adjustments.
    double design_thickness = 8;
    // Offset of the ply's bottom surface in the sampling direction, in model
    // length units.
    double offset = 9;
}

message LayupResult {
    // Distance between the reference surface and the bottom face of the
    // laminate, in model length units.
    double offset = 1;

    // Each list follows the sampling direction. If aligned is false, entries
    // are in reverse ANSYS bottom-to-top order.In
    repeated PlyLayupEntry modeling_plies = 2;
    repeated PlyLayupEntry production_plies = 3;
    repeated PlyLayupEntry analysis_plies = 4;

    // Label of the mesh element associated with the sampling point.
    int64 element_label = 6;

    // Whether the sampling direction is aligned with the element normal.
    bool aligned = 7;

    // Todo (future) add results from the CLT analysis (e.g., laminate
    // properties, ABD matrix)
}

message BatchLayupResult {
    repeated LayupResult successful_replies = 1;
    repeated base.BatchItemError failed_items = 2;
}

service ObjectService {
    rpc List(base.ListRequest) returns (ListReply);

    rpc Get(base.GetRequest) returns (ObjectInfo);
    rpc BatchGet(base.BatchGetRequest) returns (BatchGetReply);

    rpc Put(ObjectInfo) returns (ObjectInfo);
    rpc BatchPut(BatchPutRequest) returns (BatchPutReply);

    rpc Delete(base.DeleteRequest) returns (base.Empty);

    rpc BatchDelete(base.BatchDeleteRequest) returns (base.BatchDeleteReply);

    rpc Create(CreateRequest) returns (ObjectInfo);

    rpc GetLayup(GetLayupRequest) returns (LayupResult);
    rpc BatchGetLayup(BatchGetLayupRequest) returns (BatchLayupResult);

    // Custom methods

    // TODO: Export to ESACOMP XML. This is implemented in the ACP GUI, and
    // thus cannot (currently) be exposed via the gRPC API.
}
